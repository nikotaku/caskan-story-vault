<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>マーケティング実践テスト</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --panel: #ffffff;
      --panel-soft: #f8f9fc;
      --text: #172033;
      --muted: #687188;
      --line: #e3e7ef;
      --primary: #5b5ce2;
      --primary-strong: #4546c6;
      --primary-soft: #eeefff;
      --success: #178b64;
      --success-soft: #e9f8f2;
      --danger: #c44956;
      --danger-soft: #fff0f1;
      --warning: #a86808;
      --warning-soft: #fff7e4;
      --shadow: 0 18px 50px rgba(30, 37, 56, 0.08);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: radial-gradient(circle at 8% 0%, rgba(91, 92, 226, 0.10), transparent 28rem), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.6;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
    .rail {
      position: sticky; top: 0; height: 100vh; padding: 24px 18px;
      border-right: 1px solid rgba(227, 231, 239, 0.9);
      background: rgba(255, 255, 255, 0.86); backdrop-filter: blur(18px); z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 22px; border-bottom: 1px solid var(--line); }
    .brand-mark {
      width: 40px; height: 40px; display: grid; place-items: center; border-radius: 13px;
      background: linear-gradient(145deg, var(--primary), #8586ff); color: #fff; font-weight: 800;
      letter-spacing: -0.04em; box-shadow: 0 10px 24px rgba(91, 92, 226, 0.28);
    }
    .brand-name { font-size: 14px; font-weight: 800; line-height: 1.2; letter-spacing: 0.02em; }
    .brand-sub { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; }
    .rail-section { margin-top: 24px; }
    .rail-label { margin: 0 10px 10px; color: #9299aa; font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .rail-item {
      display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 12px; border: 0;
      border-radius: 12px; background: transparent; color: #596176; text-align: left; font-size: 13px;
      font-weight: 700; transition: 160ms ease;
    }
    .rail-item:hover, .rail-item.active { background: var(--primary-soft); color: var(--primary-strong); }
    .rail-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: #f0f2f7; font-size: 13px; }
    .rail-item.active .rail-icon { background: #dedfff; }
    .rail-progress { position: absolute; left: 18px; right: 18px; bottom: 20px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel-soft); }
    .rail-progress-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 11px; font-weight: 800; }
    .rail-progress-top strong { color: var(--primary); font-size: 15px; }
    .progress-track { height: 7px; overflow: hidden; margin-top: 10px; border-radius: 999px; background: #e7e9f1; }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--primary), #9293ff); transition: width 320ms ease; }
    .main { min-width: 0; }
    .topbar {
      position: sticky; top: 0; z-index: 15; display: flex; align-items: center; justify-content: space-between;
      min-height: 68px; padding: 12px clamp(20px, 4vw, 56px); border-bottom: 1px solid rgba(227, 231, 239, 0.86);
      background: rgba(244, 246, 251, 0.82); backdrop-filter: blur(18px);
    }
    .topbar-title { font-size: 13px; font-weight: 800; letter-spacing: 0.03em; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .back-link, .ghost-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 8px 13px;
      border: 1px solid var(--line); border-radius: 11px; background: rgba(255, 255, 255, 0.85); color: #4e566b;
      text-decoration: none; font-size: 12px; font-weight: 750; transition: 160ms ease;
    }
    .back-link:hover, .ghost-button:hover { border-color: #cfd4e1; background: #fff; }
    .content { width: min(1180px, 100%); margin: 0 auto; padding: 44px clamp(20px, 4vw, 56px) 72px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 12px; color: var(--primary-strong); font-size: 11px; font-weight: 850; letter-spacing: 0.12em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 5px rgba(91, 92, 226, 0.10); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 16px; font-size: clamp(30px, 5vw, 52px); line-height: 1.14; letter-spacing: -0.045em; }
    .hero-copy { max-width: 720px; margin-bottom: 0; color: var(--muted); font-size: 15px; line-height: 1.9; }
    .hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.7fr); gap: 24px; align-items: stretch; margin-bottom: 28px; }
    .hero-main, .hero-score { border: 1px solid rgba(227, 231, 239, 0.88); border-radius: var(--radius-lg); background: rgba(255, 255, 255, 0.92); box-shadow: var(--shadow); }
    .hero-main { padding: clamp(28px, 5vw, 48px); }
    .hero-score { display: flex; flex-direction: column; justify-content: space-between; padding: 28px; background: linear-gradient(150deg, rgba(91, 92, 226, 0.97), rgba(59, 60, 178, 0.98)); color: #fff; }
    .hero-score-label { color: rgba(255, 255, 255, 0.72); font-size: 11px; font-weight: 800; letter-spacing: 0.12em; }
    .hero-score-number { margin: 20px 0 10px; font-size: clamp(48px, 7vw, 74px); font-weight: 850; line-height: 1; letter-spacing: -0.06em; }
    .hero-score-number span { margin-left: 4px; font-size: 17px; font-weight: 750; letter-spacing: 0; }
    .hero-score-copy { margin: 0; color: rgba(255, 255, 255, 0.74); font-size: 12px; line-height: 1.7; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 28px; }
    .stat { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-soft); }
    .stat-label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .stat-value { margin-top: 4px; font-size: 22px; font-weight: 850; letter-spacing: -0.03em; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 42px 0 17px; }
    .section-heading h2 { margin-bottom: 5px; font-size: 22px; line-height: 1.25; letter-spacing: -0.025em; }
    .section-heading p { margin-bottom: 0; color: var(--muted); font-size: 12px; }
    .weekly-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--panel); box-shadow: 0 10px 30px rgba(30, 37, 56, 0.04); }
    .weekly-card label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 800; }
    .weekly-card input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; outline: none; color: var(--text); background: var(--panel-soft); transition: 160ms ease; }
    .weekly-card input:focus { border-color: rgba(91, 92, 226, 0.55); box-shadow: 0 0 0 4px rgba(91, 92, 226, 0.09); }
    .primary-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font-size: 13px; font-weight: 800; box-shadow: 0 10px 20px rgba(91, 92, 226, 0.22); transition: 160ms ease; }
    .primary-button:hover { background: var(--primary-strong); transform: translateY(-1px); }
    .primary-button:disabled { cursor: not-allowed; opacity: 0.5; transform: none; }
    .course-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .course-card { position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 280px; padding: 24px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--panel); box-shadow: 0 12px 36px rgba(30, 37, 56, 0.045); transition: 180ms ease; }
    .course-card:hover { transform: translateY(-3px); border-color: #d7dbeb; box-shadow: 0 18px 45px rgba(30, 37, 56, 0.08); }
    .course-card.featured { color: #fff; background: linear-gradient(145deg, #1e2639, #303a55); border-color: transparent; }
    .course-card::after { content: ""; position: absolute; top: -44px; right: -44px; width: 120px; height: 120px; border-radius: 50%; background: rgba(91, 92, 226, 0.08); }
    .course-card.featured::after { background: rgba(255, 255, 255, 0.07); }
    .course-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 22px; }
    .course-step { display: inline-flex; align-items: center; min-height: 26px; padding: 4px 9px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-strong); font-size: 10px; font-weight: 850; letter-spacing: 0.05em; }
    .featured .course-step { background: rgba(255, 255, 255, 0.12); color: #fff; }
    .course-best { color: var(--muted); font-size: 11px; font-weight: 750; }
    .featured .course-best { color: rgba(255, 255, 255, 0.62); }
    .course-card h3 { position: relative; z-index: 1; margin-bottom: 10px; font-size: 21px; letter-spacing: -0.025em; }
    .course-card p { position: relative; z-index: 1; margin-bottom: 22px; color: var(--muted); font-size: 12px; line-height: 1.75; }
    .featured p { color: rgba(255, 255, 255, 0.66); }
    .course-footer { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: auto; }
    .course-count { color: var(--muted); font-size: 11px; font-weight: 700; }
    .featured .course-count { color: rgba(255, 255, 255, 0.62); }
    .course-start { display: inline-flex; align-items: center; gap: 7px; min-height: 39px; padding: 8px 13px; border: 0; border-radius: 11px; background: #232b40; color: #fff; font-size: 11px; font-weight: 800; }
    .course-start:hover { background: #101726; }
    .featured .course-start { background: #fff; color: #222b40; }
    .cycle { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--panel); }
    .cycle-step { position: relative; padding: 20px; border-right: 1px solid var(--line); }
    .cycle-step:last-child { border-right: 0; }
    .cycle-number { display: inline-grid; place-items: center; width: 28px; height: 28px; margin-bottom: 14px; border-radius: 9px; background: var(--primary-soft); color: var(--primary-strong); font-size: 11px; font-weight: 850; }
    .cycle-step strong { display: block; margin-bottom: 5px; font-size: 13px; }
    .cycle-step span { display: block; color: var(--muted); font-size: 10px; line-height: 1.65; }
    .quiz-wrap { width: min(820px, 100%); margin: 0 auto; }
    .quiz-head { display: flex; justify-content: space-between; gap: 18px; align-items: start; margin-bottom: 20px; }
    .quiz-head h1 { margin-bottom: 6px; font-size: clamp(25px, 4vw, 36px); }
    .quiz-head p { margin-bottom: 0; color: var(--muted); font-size: 12px; }
    .quiz-counter { flex: 0 0 auto; padding: 10px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--muted); font-size: 11px; font-weight: 800; }
    .quiz-progress { margin-bottom: 16px; }
    .question-card { padding: clamp(24px, 5vw, 38px); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--panel); box-shadow: var(--shadow); }
    .question-tag { display: inline-flex; align-items: center; min-height: 27px; padding: 4px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-strong); font-size: 10px; font-weight: 850; }
    .question-card h2 { margin: 18px 0 10px; font-size: clamp(20px, 3.5vw, 27px); line-height: 1.55; letter-spacing: -0.025em; }
    .question-context { margin: 0 0 22px; padding: 13px 15px; border-left: 3px solid #c9caf9; border-radius: 0 10px 10px 0; background: #f7f7fd; color: #5d6578; font-size: 12px; line-height: 1.75; }
    .choices { display: grid; gap: 10px; }
    .choice { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; min-height: 58px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 13px; background: #fff; color: var(--text); text-align: left; transition: 150ms ease; }
    .choice:hover:not(:disabled) { border-color: rgba(91, 92, 226, 0.46); background: #fafaff; transform: translateY(-1px); }
    .choice:disabled { cursor: default; }
    .choice-letter { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: #f1f3f7; color: #70788b; font-size: 11px; font-weight: 850; }
    .choice-text { font-size: 13px; font-weight: 700; line-height: 1.55; }
    .choice-mark { width: 22px; text-align: center; font-weight: 900; }
    .choice.correct { border-color: rgba(23, 139, 100, 0.45); background: var(--success-soft); }
    .choice.correct .choice-letter { background: #ccefe2; color: var(--success); }
    .choice.wrong { border-color: rgba(196, 73, 86, 0.42); background: var(--danger-soft); }
    .choice.wrong .choice-letter { background: #ffdadd; color: var(--danger); }
    .feedback { margin-top: 20px; padding: 19px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-soft); animation: reveal 220ms ease; }
    @keyframes reveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .feedback-title { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; font-weight: 850; }
    .feedback-title.good { color: var(--success); }
    .feedback-title.bad { color: var(--danger); }
    .feedback p { margin-bottom: 0; color: #555e72; font-size: 12px; line-height: 1.8; }
    .action-box { margin-top: 13px; padding: 14px; border-radius: 11px; background: var(--warning-soft); color: #69491a; font-size: 11px; line-height: 1.75; }
    .action-box strong { display: block; margin-bottom: 3px; color: var(--warning); }
    .quiz-footer { display: flex; justify-content: flex-end; margin-top: 18px; }
    .result-hero { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 28px; align-items: center; padding: clamp(26px, 5vw, 42px); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--panel); box-shadow: var(--shadow); }
    .score-ring { width: 170px; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--primary) var(--score-angle), #ebeef4 0); position: relative; }
    .score-ring::after { content: ""; position: absolute; inset: 13px; border-radius: 50%; background: var(--panel); }
    .score-ring-content { position: relative; z-index: 1; text-align: center; }
    .score-ring strong { display: block; font-size: 42px; line-height: 1; letter-spacing: -0.06em; }
    .score-ring span { color: var(--muted); font-size: 11px; font-weight: 750; }
    .result-copy .pass-badge, .result-copy .retry-badge { display: inline-flex; padding: 5px 10px; border-radius: 999px; font-size: 10px; font-weight: 850; }
    .pass-badge { background: var(--success-soft); color: var(--success); }
    .retry-badge { background: var(--warning-soft); color: var(--warning); }
    .result-copy h1 { margin: 13px 0 8px; font-size: clamp(26px, 4vw, 38px); }
    .result-copy p { margin-bottom: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .secondary-button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: #4d5569; font-size: 12px; font-weight: 800; }
    .secondary-button:hover { background: var(--panel-soft); }
    .breakdown-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .breakdown-card { padding: 16px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); }
    .breakdown-card span { color: var(--muted); font-size: 10px; font-weight: 750; }
    .breakdown-card strong { display: block; margin-top: 4px; font-size: 20px; }
    .review-list { display: grid; gap: 12px; }
    .review-item { padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
    .review-item h3 { margin-bottom: 8px; font-size: 14px; line-height: 1.6; }
    .review-answer { margin-bottom: 7px; color: var(--success); font-size: 11px; font-weight: 800; }
    .review-item p { margin-bottom: 0; color: var(--muted); font-size: 11px; line-height: 1.75; }
    .empty-review { padding: 24px; border: 1px dashed #cfd4df; border-radius: 14px; background: rgba(255, 255, 255, 0.58); color: var(--muted); text-align: center; font-size: 12px; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 100; padding: 12px 15px; border-radius: 12px; background: #1d2538; color: #fff; font-size: 12px; font-weight: 750; box-shadow: 0 14px 38px rgba(17, 24, 39, 0.24); animation: reveal 200ms ease; }
    .mobile-title { display: none; }
    @media (max-width: 900px) {
      .shell { display: block; } .rail { display: none; } .mobile-title { display: block; } .topbar-title { display: none; }
      .content { padding-top: 30px; } .hero { grid-template-columns: 1fr; } .hero-score { min-height: 220px; }
    }
    @media (max-width: 680px) {
      .topbar { padding-inline: 16px; } .content { padding: 24px 16px 54px; } .back-link span { display: none; }
      .stats { grid-template-columns: 1fr; } .course-grid { grid-template-columns: 1fr; } .weekly-card { grid-template-columns: 1fr; }
      .weekly-card .primary-button { width: 100%; } .cycle { grid-template-columns: 1fr 1fr; } .cycle-step:nth-child(2) { border-right: 0; }
      .cycle-step:nth-child(-n+2) { border-bottom: 1px solid var(--line); } .quiz-head { align-items: center; }
      .question-card { padding: 22px 17px; border-radius: 18px; } .choice { grid-template-columns: 32px minmax(0, 1fr) 18px; padding-inline: 11px; }
      .choice-text { font-size: 12px; } .quiz-footer .primary-button { width: 100%; } .result-hero { grid-template-columns: 1fr; text-align: center; }
      .score-ring { margin: 0 auto; } .result-actions { justify-content: center; } .result-actions button { flex: 1 1 150px; }
      .breakdown-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "marketing-study-v1";
      const WEEKLY_KEY = "marketing-study-weekly-question-v1";
      const LETTERS = ["A", "B", "C", "D"];
      const courses = [
        {
          id: "foundation", step: "STEP 1 / 1〜2週目", title: "基礎設計テスト",
          description: "顧客、悩み、選ばれる理由、導線を整理し、施策を考える前提を固めます。",
          questions: [
            { id: "f1", category: "基礎", prompt: "マーケティングを身につける学習順として、最も適切なものはどれですか？", choices: ["投稿を大量保存し、知識量を増やす", "学ぶ、試す、数字を見る、人に説明する", "交流会へ毎週参加し、知り合いを増やす", "成功者の施策をそのまま再現する"], answer: 1, explanation: "知識は、実際に使って結果を確認して初めて判断できる形になります。さらに人に説明すると、理解の曖昧な部分が明確になります。", action: "今週学んだ内容から、店舗で一つだけ試せる施策を決めてください。" },

      const renderResult = () => {
        const course = getCurrentCourse(); const correct = state.answers.filter((answer) => answer.correct).length; const total = state.answers.length; const percentage = Math.round((correct / total) * 100); const passed = percentage >= 80; const wrongAnswers = state.answers.filter((answer) => !answer.correct); const categoryMap = {};
        state.answers.forEach((answer) => { const key = answer.question.category; if (!categoryMap[key]) categoryMap[key] = { correct: 0, total: 0 }; categoryMap[key].total += 1; if (answer.correct) categoryMap[key].correct += 1; });
        const breakdown = Object.entries(categoryMap).map(([category, value]) => `<div class="breakdown-card"><span>${escapeHtml(category)}</span><strong>${value.correct} / ${value.total}</strong></div>`).join("");
        const review = wrongAnswers.length ? wrongAnswers.map((answer) => `<article class="review-item"><h3>${escapeHtml(answer.question.prompt)}</h3><div class="review-answer">正解：${escapeHtml(answer.question.choices[answer.question.answer])}</div><p>${escapeHtml(answer.question.explanation)}</p></article>`).join("") : '<div class="empty-review">全問正解です。実務課題へ進んでください。</div>';
        const resultTitle = passed ? (percentage === 100 ? "判断基準が定着しています" : "合格基準を達成しました") : "誤答を実務課題に変えます";
        app.innerHTML = shell(`<div class="quiz-wrap"><section class="result-hero"><div class="score-ring" style="--score-angle:${percentage * 3.6}deg"><div class="score-ring-content"><strong>${percentage}</strong><span>POINT</span></div></div><div class="result-copy"><span class="${passed ? "pass-badge" : "retry-badge"}">${passed ? "合格" : "復習推奨"}</span><h1>${resultTitle}</h1><p>${escapeHtml(course.title)}：${correct}問正解 / 全${total}問。合格基準は80％です。</p><div class="result-actions">${wrongAnswers.length ? '<button class="primary-button" data-action="retry-wrong">間違えた問題だけ解く</button>' : ""}<button class="secondary-button" data-action="restart">同じテストをやり直す</button><button class="secondary-button" data-action="home">学習一覧へ戻る</button></div></div></section><div class="section-heading"><div><h2>分野別の結果</h2><p>正答数が少ない分野を、次の学習テーマにします。</p></div></div><section class="breakdown-grid">${breakdown}</section><div class="section-heading"><div><h2>復習する問題</h2><p>正解を覚えるだけでなく、解説の実務課題を一つ試します。</p></div></div><section class="review-list">${review}</section></div>`, course.id);
      };
      const goHome = () => { if (state.view === "quiz" && state.answers.length > 0 && state.answers.length < state.queue.length) { const leave = window.confirm("回答途中の内容は保存されません。学習一覧へ戻りますか？"); if (!leave) return; } state.view = "home"; state.courseId = null; state.queue = []; state.answers = []; renderHome(); window.scrollTo({ top: 0, behavior: "smooth" }); };
      app.addEventListener("click", (event) => {
        const button = event.target.closest("[data-action]"); if (!button) return; const action = button.dataset.action;
        if (action === "home") goHome();
        if (action === "start") startQuiz(button.dataset.course);
        if (action === "answer") answerQuestion(Number(button.dataset.index));
        if (action === "next") nextQuestion();
        if (action === "restart") startQuiz(state.courseId);
        if (action === "retry-wrong") { const wrongQuestions = state.answers.filter((answer) => !answer.correct).map((answer) => answer.question); startQuiz(state.courseId, wrongQuestions, true); }
        if (action === "save-weekly") { const input = document.getElementById("weeklyQuestion"); localStorage.setItem(WEEKLY_KEY, input?.value.trim() || ""); showToast("今週の問いを保存しました"); }
      });
      renderHome();
    })();
  </script>
</body>
</html>
